aid: manabio
name: Mana.bio
description: >-
  Mana.bio is an AI-driven drug-delivery biotechnology company specializing in
  programmable lipid nanoparticles (LNPs) for nucleic-acid therapeutics and
  vaccines, including mRNA, DNA, and CRISPR-based gene therapy. The company runs
  a closed-loop design-build-test-learn platform that uses machine-learning models
  to design novel LNP candidates, synthesizes dozens of formulations weekly via
  high-throughput automation, screens them with comprehensive assays, and feeds
  results back to continuously improve its models — targeting precise, optimized
  extrahepatic delivery. Mana.bio also operates Mina (ChatLNP), an AI agent that
  helps scientists explore curated literature, predict LNP properties, and optimize
  formulations, plus an LNP patents / freedom-to-operate map. The company is backed
  by a16z. Mana.bio publishes no first-party developer or product API; its only
  public agent surface is a Wix Site MCP endpoint and an llms.txt on its site.
